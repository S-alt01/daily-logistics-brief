name: Daily Logistics Intelligence Brief

on:
  schedule:
    # Beijing Time 07:00 = UTC 23:00
    - cron: '0 23 * * *'

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Checkout Repository
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # Setup Python
      # =========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================================
      # Install Dependencies
      # =========================================

      - name: Install dependencies
        run: |
          pip install feedparser reportlab requests

      # =========================================
      # Fetch RSS News
      # =========================================

      - name: Fetch news
        run: |
          python scripts/fetch_news.py

      # =========================================
      # Summarize News
      # =========================================

      - name: Summarize news
        run: |
          python scripts/summarize_news.py

      # =========================================
      # Generate PDF
      # =========================================

      - name: Generate PDF
        run: |
          python scripts/generate_pdf.py

      # =========================================
      # Upload PDF Artifact
      # =========================================

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: daily-logistics-brief
          path: daily_brief.pdf

      # =========================================
      # Send PDF via Resend
      # =========================================

      - name: Send PDF email via Resend
        run: |
          python -c "
import requests
import base64

with open('daily_brief.pdf', 'rb') as f:
    pdf_data = f.read()

encoded_pdf = base64.b64encode(pdf_data).decode('utf-8')

headers = {
    'Authorization': 'Bearer ${{ secrets.RESEND_API_KEY }}',
    'Content-Type': 'application/json'
}

payload = {
    'from': 'onboarding@resend.dev',
    'to': ['yuanrandeng@aliyun.com'],
    'subject': 'Daily Logistics Intelligence Brief',
    'html': '<h2>Daily Logistics Intelligence Brief</h2><p>Attached is today\\'s PDF report.</p>',
    'attachments': [
        {
            'filename': 'daily_brief.pdf',
            'content': encoded_pdf
        }
    ]
}

response = requests.post(
    'https://api.resend.com/emails',
    headers=headers,
    json=payload
)

print(response.status_code)
print(response.text)
"

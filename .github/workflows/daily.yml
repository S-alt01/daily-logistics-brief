name: Daily Logistics Brief

on:
  schedule:
    # Beijing Time 07:00 = UTC 23:00
    - cron: '0 23 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Checkout Repository
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # Setup Python
      # =========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================================
      # Install Dependencies
      # =========================================

      - name: Install dependencies
        run: |
          pip install feedparser reportlab

      # =========================================
      # Fetch RSS News
      # =========================================

      - name: Fetch RSS news
        run: python scripts/fetch_news.py

      # =========================================
      # Summarize News
      # =========================================

      - name: Summarize news
        run: python scripts/summarize_news.py

      # =========================================
      # Generate PDF
      # =========================================

      - name: Generate PDF
        run: python scripts/generate_pdf.py

      # =========================================
      # Commit Generated Files
      # =========================================

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Daily logistics brief update" || echo "No changes"

          git push

name: Daily Brief

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Show files
        run: |
          pwd
          ls -R || true

      - name: Fetch RSS news
        run: |
          python scripts/fetch_news.py || true

      - name: Summarize with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/summarize_news.py || true

      - name: Generate PDF brief
        run: |
          python scripts/generate_pdf.py || true

      - name: Final check
        run: |
          ls

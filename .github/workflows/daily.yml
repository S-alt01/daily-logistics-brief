name: Daily Brief

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: echo "hello world" > test.txt

      - run: ls -la

      - name: Commit file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add test.txt

          git commit -m "Add test file" || echo "No changes"

          git push
